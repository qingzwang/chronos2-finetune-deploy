# Chronos-1 Training Configuration
# T5-based seq2seq model for time series forecasting

# Model settings
model_type: chronos1
model_id: amazon/chronos-t5-small

# Data settings
data_dir: /home/ubuntu/efs/to_customer/zendure/data/
split_csv: /home/ubuntu/efs/to_customer/zendure/zero-shot/data_split.csv
context_length: 512
prediction_length: 48  # 24 hours at 30-minute intervals
use_covariates: false  # Chronos-1 does not support covariates

# Training settings
batch_size: 32
learning_rate: 1.0e-5
num_steps: 10000
finetune_mode: full
gradient_accumulation_steps: 1
warmup_steps: 100
weight_decay: 0.01
max_grad_norm: 1.0

# Output settings
output_dir: ./output/chronos1/
logging_steps: 100
save_steps: 1000
eval_steps: 500
save_total_limit: 3

# Precision settings
fp16: false
bf16: true

# Other settings
seed: 42
num_workers: 4
val_ratio: 0.1  # Ratio of training data for validation (0.0 = no validation)
eval_batch_size: 64
