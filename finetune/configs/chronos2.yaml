# Chronos-2 Training Configuration
# Quantile regression model with covariate support

# Model settings
model_type: chronos2
model_id: amazon/chronos-2

# Data settings
data_dir: /home/ubuntu/efs/to_customer/zendure/data/
split_csv: /home/ubuntu/efs/to_customer/zendure/zero-shot/data_split.csv
context_length: 336  # 7 days
prediction_length: 48  # 24 hours at 30-minute intervals
use_covariates: true   # Use temperature and irradiance as covariates

# Training settings
batch_size: 192  # number of rows (target + covariates)
learning_rate: 1.0e-5
num_steps: 100000
finetune_mode: full    # Options: "full" or "lora"
gradient_accumulation_steps: 4
warmup_steps: 500
weight_decay: 0.0
max_grad_norm: 1.0

# LoRA settings (used when finetune_mode: lora)
lora_rank: 8
lora_alpha: 32
lora_dropout: 0.1
lora_target_modules:
  - q
  - v
  - k
  - o
  - output_patch_embedding

# Output settings
output_dir: ./output/chronos2-336-48-covariant-full-100k-w-covariates-covariate_dropout-4-gpus/
logging_steps: 100
save_steps: 1000
eval_steps: 500
save_total_limit: 3

# Precision settings
fp16: false
bf16: true

# Other settings
seed: 42
num_workers: 4
val_ratio: 0.01  # Ratio of training data for validation (0.0 = no validation)
eval_batch_size: 64

# Data augmentation (only applied to target series during training)
augmentation: false           # Enable data augmentation
aug_jitter_sigma: 0.03       # Noise level relative to series std (0.03 = 3%)
aug_scaling_sigma: 0.1       # Scaling variation (0.1 = ±10%, clamped to 80%-120%)
aug_mag_warp_sigma: 0.2      # Magnitude warping intensity (variation around 1.0)
aug_mag_warp_knots: 4        # Number of knots for warping spline (more knots = higher frequency)
aug_prob: 0.5                # Probability of applying each augmentation

# covariate augmentation
covariate_dropout_prob: 0.2  # Probability of dropping all covariates per sample (forces model to learn from history)
